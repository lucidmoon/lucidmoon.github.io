<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALCULUS QUEST: 8-BIT EDITION</title>
  <!-- Google Fonts for Retro Pixel Aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. RETRO PIXEL DESIGN TOKENS & BASE RESET
       ========================================================================== */
    :root {
      --bg-deep: #120d24;
      --bg-panel: #1f183d;
      --bg-panel-dark: #16102d;
      --bg-card: #29204e;
      --border-light: #a594f9;
      --border-dark: #090612;
      --accent-gold: #ffd166;
      --accent-gold-dark: #d99b1e;
      --accent-cyan: #4cc9f0;
      --accent-pink: #f72585;
      --accent-green: #06d6a0;
      --accent-green-dark: #048a66;
      --accent-red: #ef476f;
      --accent-red-dark: #a81c3e;
      --text-main: #f8f9fa;
      --text-muted: #b8b2d8;
      --font-pixel: 'Press Start 2P', 'Courier New', monospace;
      --font-readable: 'VT323', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(76, 201, 240, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(247, 37, 133, 0.08) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      color: var(--text-main);
      font-family: var(--font-readable);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(6px, 2vw, 14px);
    }

    /* ==========================================================================
       2. CRT SCANLINES EFFECT (TOGGLEABLE)
       ========================================================================== */
    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 4px, 6px 100%;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }

    .crt-overlay.hidden {
      opacity: 0;
    }

    /* ==========================================================================
       3. PIXEL FRAME & RETRO BUTTONS
       ========================================================================== */
    .game-shell {
      width: 100%;
      max-width: 820px;
      background: var(--bg-panel);
      border: 4px solid var(--border-dark);
      box-shadow:
        inset 0 0 0 4px var(--border-light),
        inset 0 0 0 8px var(--bg-panel-dark),
        0 10px 0 rgba(0, 0, 0, 0.6);
      padding: clamp(12px, 3vw, 20px);
      position: relative;
    }

    /* Top Control Strip (Sound + CRT Toggles) */
    .utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 4px dashed rgba(165, 148, 249, 0.25);
      gap: 8px;
      flex-wrap: wrap;
    }

    .arcade-badge {
      font-family: var(--font-pixel);
      font-size: clamp(0.5rem, 1.8vw, 0.65rem);
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .blink-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      to { visibility: hidden; }
    }

    .utility-controls {
      display: flex;
      gap: 6px;
    }

    .pixel-btn-mini {
      font-family: var(--font-pixel);
      font-size: clamp(0.52rem, 1.8vw, 0.6rem);
      padding: 8px 10px;
      min-height: 44px;
      min-width: 44px;
      background: var(--bg-card);
      color: var(--text-main);
      border: 3px solid var(--border-dark);
      box-shadow: inset -2px -2px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.15);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s;
    }

    .pixel-btn-mini:hover {
      background: #372b66;
      color: var(--accent-gold);
    }

    .pixel-btn-mini:active {
      transform: translateY(2px);
    }

    .pixel-btn-mini.danger {
      color: #ff9eb5;
      min-height: 36px;
      padding: 6px 8px;
      font-size: 0.5rem;
    }

    .pixel-btn-mini.danger:hover {
      background: var(--accent-red-dark);
      color: #fff;
    }

    /* Primary Retro Arcade Button */
    .pixel-btn {
      font-family: var(--font-pixel);
      font-size: clamp(0.72rem, 2.4vw, 0.85rem);
      padding: 14px 20px;
      min-height: 48px;
      background: var(--accent-gold);
      color: #1a1100;
      border: 4px solid var(--border-dark);
      box-shadow:
        inset -4px -4px 0 var(--accent-gold-dark),
        inset 4px 4px 0 #fff1b8,
        0 4px 0 var(--border-dark);
      cursor: pointer;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s, filter 0.1s;
    }

    .pixel-btn:hover {
      filter: brightness(1.07);
    }

    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow:
        inset -2px -2px 0 var(--accent-gold-dark),
        inset 2px 2px 0 #fff1b8,
        0 0 0 var(--border-dark);
    }

    .pixel-btn.cyan {
      background: var(--accent-cyan);
      color: #051923;
      box-shadow:
        inset -4px -4px 0 #2188a8,
        inset 4px 4px 0 #b8ecff,
        0 4px 0 var(--border-dark);
    }

    .pixel-btn.green {
      background: var(--accent-green);
      color: #04241b;
      box-shadow:
        inset -4px -4px 0 var(--accent-green-dark),
        inset 4px 4px 0 #89ffe0,
        0 4px 0 var(--border-dark);
    }

    /* ==========================================================================
       4. SCREENS & LAYOUT
       ========================================================================== */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: pixelFadeIn 0.25s steps(4);
    }

    @keyframes pixelFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* START SCREEN */
    .start-hero {
      text-align: center;
      padding: 8px 4px 12px;
    }

    .game-title {
      font-family: var(--font-pixel);
      font-size: clamp(1.1rem, 4.2vw, 1.95rem);
      line-height: 1.4;
      color: var(--accent-gold);
      text-shadow:
        3px 3px 0 var(--border-dark),
        -2px -2px 0 var(--accent-pink);
      margin-bottom: 8px;
    }

    .game-subtitle {
      font-family: var(--font-pixel);
      font-size: clamp(0.58rem, 2vw, 0.82rem);
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .stage-preview-box {
      background: var(--bg-panel-dark);
      border: 4px solid var(--border-dark);
      box-shadow: inset 0 0 0 3px #382c6b;
      padding: clamp(10px, 2.5vw, 16px);
      margin: 0 auto 14px;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .sprite-duo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 5vw, 32px);
      padding: 4px 0;
    }

    .vs-badge {
      font-family: var(--font-pixel);
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      color: var(--accent-pink);
      text-shadow: 2px 2px 0 #000;
    }

    .quest-brief {
      font-size: clamp(1.15rem, 3.2vw, 1.35rem);
      line-height: 1.3;
      color: var(--text-main);
      max-width: 540px;
    }

    .topic-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 2px;
    }

    .topic-pill {
      font-family: var(--font-pixel);
      font-size: clamp(0.48rem, 1.5vw, 0.55rem);
      padding: 5px 7px;
      background: var(--bg-card);
      border: 2px solid var(--border-light);
      color: var(--accent-gold);
    }

    /* ==========================================================================
       4A. ARCADE CABINET: PLAYER NAME & INSERT COIN SLOT (START SCREEN)
       ========================================================================== */
    .arcade-cabinet-controls {
      background: var(--bg-panel-dark);
      border: 4px solid var(--border-dark);
      box-shadow: inset 0 0 0 3px #382c6b;
      padding: clamp(12px, 2.8vw, 16px);
      margin: 0 auto 14px;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cabinet-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .name-entry-group {
      flex: 1 1 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-card);
      border: 3px solid var(--border-dark);
      padding: 8px 10px;
    }

    .cabinet-label {
      font-family: var(--font-pixel);
      font-size: clamp(0.5rem, 1.6vw, 0.58rem);
      color: var(--accent-cyan);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .start-name-input {
      font-family: var(--font-pixel);
      font-size: clamp(0.75rem, 2.3vw, 0.9rem);
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 2px;
      width: 100%;
      max-width: 220px;
      min-height: 44px;
      padding: 8px 10px;
      background: var(--bg-panel-dark);
      color: var(--accent-gold);
      border: 3px solid var(--border-dark);
      box-shadow: inset 0 0 0 2px var(--border-light);
      outline: none;
      user-select: text;
    }

    .start-name-input:focus {
      box-shadow: inset 0 0 0 2px var(--accent-gold);
    }

    .coin-slot-group {
      flex: 1 1 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 3px solid var(--border-dark);
      padding: 8px 10px;
      position: relative;
    }

    .coin-slot-housing {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    /* Authentic Red Arcade Reject/Coin Button + Vertical Coin Slit */
    .insert-coin-btn {
      font-family: var(--font-pixel);
      font-size: clamp(0.56rem, 1.8vw, 0.66rem);
      padding: 10px 12px;
      min-height: 46px;
      background: #e63946;
      color: #fff;
      border: 3px solid var(--border-dark);
      box-shadow:
        inset -3px -3px 0 #9e1924,
        inset 3px 3px 0 #ff8fa3,
        0 3px 0 var(--border-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      transition: transform 0.08s;
    }

    .insert-coin-btn:hover {
      filter: brightness(1.08);
    }

    .insert-coin-btn:active {
      transform: translateY(3px);
      box-shadow: inset -2px -2px 0 #9e1924, 0 0 0 var(--border-dark);
    }

    .coin-slit-plate {
      width: 24px;
      height: 42px;
      background: #141124;
      border: 3px solid #6c639c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .coin-slit-hole {
      width: 5px;
      height: 26px;
      background: #000;
      border: 1px solid #ffd166;
    }

    .pixel-coin-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      background: var(--accent-gold);
      border: 2px solid #090612;
      box-shadow: inset -2px -2px 0 var(--accent-gold-dark), inset 2px 2px 0 #fff3b0;
      border-radius: 50%;
      flex-shrink: 0;
    }

    @keyframes coinDropAnim {
      0% { transform: translateY(-22px) scale(1.1); opacity: 1; }
      60% { transform: translateY(0px) scale(0.85); opacity: 1; }
      100% { transform: translateY(6px) scale(0.2); opacity: 0; }
    }

    .dropping-coin {
      position: absolute;
      top: 4px;
      left: 50%;
      margin-left: -8px;
      pointer-events: none;
      animation: coinDropAnim 0.35s steps(5) forwards;
    }

    .credit-led-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 6px 10px;
      background: #090612;
      border: 2px solid var(--border-light);
      font-family: var(--font-pixel);
      font-size: clamp(0.55rem, 1.8vw, 0.68rem);
    }

    .credit-status-text {
      color: var(--accent-pink);
      animation: blink 1s steps(2, start) infinite;
    }

    .credit-status-text.ready {
      color: var(--accent-green);
      animation: none;
    }

    .credit-counter {
      color: var(--accent-gold);
      letter-spacing: 1px;
    }

    .pixel-btn.locked {
      background: #4a426e;
      color: #b8b2d8;
      box-shadow:
        inset -4px -4px 0 #2c2647,
        inset 4px 4px 0 #6c6299,
        0 4px 0 var(--border-dark);
      cursor: pointer;
    }

    @keyframes shakeLocked {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }

    .anim-shake-locked {
      animation: shakeLocked 0.3s steps(4);
    }

    /* ==========================================================================
       4B. HIGH SCORE / HALL OF FAME LEADERBOARD STYLES
       ========================================================================== */
    .highscore-panel {
      background: var(--bg-panel-dark);
      border: 4px solid var(--border-dark);
      box-shadow: inset 0 0 0 3px #3c2f73;
      padding: clamp(10px, 2.5vw, 14px);
      margin: 14px auto 0;
      max-width: 640px;
      text-align: left;
    }

    .highscore-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 3px dashed rgba(255, 209, 102, 0.3);
    }

    .highscore-title {
      font-family: var(--font-pixel);
      font-size: clamp(0.6rem, 2vw, 0.72rem);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .personal-best-pill {
      font-family: var(--font-pixel);
      font-size: clamp(0.48rem, 1.6vw, 0.56rem);
      background: rgba(6, 214, 160, 0.15);
      border: 2px solid var(--accent-green);
      color: var(--accent-green);
      padding: 4px 7px;
    }

    .highscore-table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(1.1rem, 3vw, 1.28rem);
    }

    .highscore-table th {
      font-family: var(--font-pixel);
      font-size: clamp(0.46rem, 1.4vw, 0.54rem);
      color: var(--text-muted);
      text-align: left;
      padding: 4px 6px 6px;
      border-bottom: 2px solid #352963;
    }

    .highscore-table td {
      padding: 6px 6px;
      border-bottom: 1px solid rgba(165, 148, 249, 0.14);
      vertical-align: middle;
    }

    .highscore-table tr:last-child td {
      border-bottom: none;
    }

    .highscore-table tr.highlight-row {
      background: rgba(255, 209, 102, 0.18);
      outline: 2px solid var(--accent-gold);
    }

    .hs-rank {
      font-family: var(--font-pixel);
      font-size: clamp(0.55rem, 1.6vw, 0.65rem);
      color: var(--accent-cyan);
      width: 44px;
    }

    .hs-rank.top-1 { color: var(--accent-gold); }
    .hs-rank.top-2 { color: #e0e1dd; }
    .hs-rank.top-3 { color: #f4a261; }

    .hs-name {
      font-family: var(--font-pixel);
      font-size: clamp(0.56rem, 1.7vw, 0.68rem);
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .hs-score {
      font-family: var(--font-pixel);
      font-size: clamp(0.56rem, 1.7vw, 0.68rem);
      color: var(--accent-gold);
      text-align: right;
      white-space: nowrap;
    }

    .hs-acc {
      color: var(--accent-green);
      text-align: center;
      white-space: nowrap;
    }

    .hs-date {
      color: var(--text-muted);
      font-size: clamp(0.95rem, 2.4vw, 1.1rem);
      text-align: right;
      white-space: nowrap;
    }

    .highscore-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 2px dashed rgba(165, 148, 249, 0.2);
      gap: 8px;
      flex-wrap: wrap;
    }

    .reset-confirm-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-pixel);
      font-size: 0.5rem;
      color: var(--accent-red);
    }

    /* New High Score Entry Box on End Screen */
    .new-record-box {
      background: linear-gradient(180deg, rgba(255, 209, 102, 0.16) 0%, rgba(247, 37, 133, 0.12) 100%);
      border: 4px solid var(--accent-gold);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.25);
      padding: 12px;
      margin: 0 auto 14px;
      max-width: 640px;
      text-align: center;
    }

    .new-record-title {
      font-family: var(--font-pixel);
      font-size: clamp(0.62rem, 2vw, 0.78rem);
      color: var(--accent-gold);
      margin-bottom: 6px;
      animation: blink 1.2s steps(2, start) infinite;
    }

    .new-record-sub {
      font-size: clamp(1.1rem, 2.8vw, 1.25rem);
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .initials-form {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .initials-input {
      font-family: var(--font-pixel);
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 3px;
      width: 170px;
      min-height: 48px;
      padding: 10px 12px;
      background: var(--bg-panel-dark);
      color: var(--accent-gold);
      border: 4px solid var(--border-dark);
      box-shadow: inset 0 0 0 2px var(--accent-cyan);
      outline: none;
      user-select: text;
    }

    .initials-input:focus {
      box-shadow: inset 0 0 0 3px var(--accent-gold);
    }

    /* ==========================================================================
       5. QUIZ HUD & BATTLE ARENA
       ========================================================================== */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(6px, 2vw, 10px);
      margin-bottom: 10px;
    }

    .hud-box {
      background: var(--bg-panel-dark);
      border: 3px solid var(--border-dark);
      box-shadow: inset 0 0 0 2px #3c2f73;
      padding: clamp(6px, 1.8vw, 9px) 6px;
      text-align: center;
    }

    .hud-label {
      font-family: var(--font-pixel);
      font-size: clamp(0.46rem, 1.4vw, 0.55rem);
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    .hud-value {
